groups:
  quality:
    tasks:
      all:
        help: Run formatting, lint, typing, and security checks
        run: |
          ruff format --check .
          ruff check .
          mypy src
          bandit -r src
          vulture src

  tests:
    tasks:
      all:
        help: Run the unit, contract, and integration test suites with coverage
        run: pytest --cov=infodengue_pipeline --cov-report=term-missing --cov-fail-under=90
      unit:
        help: Run unit tests
        run: pytest tests/unit

  docs:
    tasks:
      build:
        help: Build strict documentation
        run: mkdocs build --strict --config-file mkdocs.yaml

  db:
    tasks:
      upgrade:
        help: Apply migrations to the configured development database
        run: >-
          env INFODENGUE_PIPELINE_DATABASE_URL=postgresql+psycopg://pipeline_dev:pipeline_dev_only@localhost:5434/pipeline_dev
          alembic upgrade head

  containers:
    tasks:
      config:
        help: Validate the development Compose configuration
        run: docker compose --env-file .env.example -f containers/compose.yaml config --quiet
      staging-config:
        help: Validate the staging topology using placeholders only
        run: >-
          env PIPELINE_WORKER_ENV_FILE=../.env.staging.example
          PIPELINE_ANALYSIS_ENV_FILE=../.env.staging.analysis.example
          PIPELINE_E2E_ENV_FILE=../.env.staging.e2e.example
          docker compose --env-file .env.staging.example
          -f containers/compose-staging.yaml config --quiet
      prod-config:
        help: Validate the production topology using placeholders only
        run: >-
          env PIPELINE_WORKER_ENV_FILE=../.env.prod.example
          PIPELINE_ANALYSIS_ENV_FILE=../.env.prod.analysis.example
          docker compose --env-file .env.prod.example
          -f containers/compose-prod.yaml config --quiet
      up:
        help: Start development services
        run: docker compose --env-file .env.example -f containers/compose.yaml up -d --build
      down:
        help: Stop development services
        run: docker compose --env-file .env.example -f containers/compose.yaml down

  dev:
    tasks:
      validate:
        help: Run the development-only service validation test
        run: >-
          env INFODENGUE_PIPELINE_DATABASE_URL=postgresql+psycopg://pipeline_dev:pipeline_dev_only@localhost:5434/pipeline_dev
          INFODENGUE_PIPELINE_RABBITMQ_URL=amqp://pipeline_dev:pipeline_dev_only@localhost:5673//
          INFODENGUE_PIPELINE_MINIO_ENDPOINT=localhost:9002
          python scripts/validate_dev.py

  staging:
    tasks:
      e2e:
        help: Submit a fresh fixture and validate a clean staging E2E
        backend: bash
        args:
          fixture:
            help: Local CSV or DBF fixture path
            type: string
            required: true
          timeout-seconds:
            help: Maximum wait for each named workflow stage
            type: integer
            default: 7200
        run: >-
          bash scripts/run_staging_e2e.sh
          '${{ args.fixture | replace("'", "'\"'\"'") }}'
          '${{ args.timeout_seconds }}'
      validate-storage:
        help: Validate canonical storage on the staging server's local filesystem
        run: python scripts/validate_staging_storage.py
      validate-e2e:
        help: Validate one explicitly supplied object through the real staging E2E flow
        args:
          object-key:
            help: Safe staging MinIO fixture object key
            type: string
            required: true
          timeout-seconds:
            help: Maximum wait for each named workflow stage
            type: integer
            default: 7200
        run: >-
          docker compose --env-file .env.staging
          -f containers/compose-staging.yaml run --rm validator
          python scripts/validate_staging_e2e.py
          --object-key "${{ args.object_key }}"
          --timeout-seconds "${{ args.timeout_seconds }}"
