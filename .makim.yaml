groups:
  quality:
    tasks:
      all:
        help: Run formatting, lint, typing, and security checks
        run: |
          ruff format --check .
          ruff check .
          mypy src
          bandit -r src

  tests:
    tasks:
      all:
        help: Run the unit, contract, and integration test suites with coverage
        run: pytest --cov=infodengue_pipeline --cov-report=term-missing --cov-fail-under=90
      unit:
        help: Run unit tests
        run: pytest tests/unit

  docs:
    tasks:
      build:
        help: Build strict documentation
        run: mkdocs build --strict --config-file mkdocs.yaml

  db:
    tasks:
      upgrade:
        help: Apply migrations to the configured development database
        run: >-
          env INFODENGUE_PIPELINE_DATABASE_URL=postgresql+psycopg://pipeline_dev:pipeline_dev_only@localhost:5434/pipeline_dev
          alembic upgrade head

  containers:
    tasks:
      config:
        help: Validate the development Compose configuration
        run: docker compose --env-file .env.example -f containers/compose.yaml config --quiet
      up:
        help: Start development services
        run: docker compose --env-file .env.example -f containers/compose.yaml up -d --build
      down:
        help: Stop development services
        run: docker compose --env-file .env.example -f containers/compose.yaml down

  dev:
    tasks:
      smoke:
        help: Run the development-only service smoke test
        run: >-
          env INFODENGUE_PIPELINE_DATABASE_URL=postgresql+psycopg://pipeline_dev:pipeline_dev_only@localhost:5434/pipeline_dev
          INFODENGUE_PIPELINE_RABBITMQ_URL=amqp://pipeline_dev:pipeline_dev_only@localhost:5673//
          INFODENGUE_PIPELINE_MINIO_ENDPOINT=localhost:9002
          python scripts/smoke_dev.py

  staging:
    tasks:
      storage-smoke:
        help: Validate canonical storage on the staging server's local filesystem
        run: python scripts/smoke_staging_storage.py
