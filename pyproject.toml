[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
index-url = "https://pypi.org/simple"


[project]
name = "infodengue-pipeline"
authors = [
  { name = "Sandro Loch", email = "es.loch@gmail.com" },
]
description = "Standalone SINAN ingestion and workflow coordination service for InfoDengue."
readme = "README.md"
license = "GPL-3.0-only"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Topic :: Database",
  "Typing :: Typed",
]

version = "0.1.0"
requires-python = ">=3.11,<3.12"
scripts = { infodengue-pipeline = "infodengue_pipeline.cli:app" }
dependencies = [
  "alembic>=1.20.0",
  "celery>=5.6.3",
  "click>=8.1,<9",
  "epiweeks>=2.4.0",
  "kombu>=5.6.2",
  "minio>=7.2.20",
  "psycopg[binary]>=3.3.6",
  "pydantic>=2",
  "pydantic-settings>=2.15.0",
  "sqlalchemy>=2",
  "structlog>=26.1.0",
]


[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6",
  "coverage>=7",
  "pre-commit>=4",
  "ruff>=0.14",
  "mypy>=1.18",
  "bandit>=1.8",
  "makim>=1.27",
  "vulture>=2.7",
  "mkdocs>=1.6",
  "mkdocs-material>=9.6",
  "containers-sugar>=1.19.3",
]

[project.urls]
Homepage = "https://github.com/esloch/infodengue-pipeline"
"Bug Tracker" = "https://github.com/esloch/infodengue-pipeline/issues"
Discussions = "https://github.com/esloch/infodengue-pipeline/discussions"
Changelog = "https://github.com/esloch/infodengue-pipeline/releases"


[tool.bandit]
exclude_dirs = ["tests"]
targets = "./"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
exclude = ["scripts/"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = [
    "tests",
]

[tool.ruff]
line-length = 79
target-version = "py311"
force-exclude = true
src = ["./"]
exclude = [
  'docs',
]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle
  "F",   # pyflakes
  "D",   # pydocstyle
  "YTT", # flake8-2020
  "RUF", # Ruff-specific rules
  "I001",  # isort
]
fixable = ["I001"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
# Use a single line between direct and from import
lines-between-types = 1

[tool.ruff.format]
quote-style = "single"

[tool.vulture]
exclude = ["tests"]
ignore_decorators = []
ignore_names = []
make_whitelist = true
min_confidence = 80
paths = ["./"]
sort_by_size = true
verbose = false
