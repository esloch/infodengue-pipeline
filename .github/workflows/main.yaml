name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Python and dependencies
        run: uv sync --locked --extra dev
      - name: Verify lockfile
        run: uv lock --check
      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy src
      - name: Security scan
        run: uv run bandit -r src
      - name: Tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: uv run pytest -p pytest_cov --cov=infodengue_pipeline --cov-report=term-missing --cov-fail-under=90
      - name: Build
        run: uv build
      - name: Documentation
        run: uv run mkdocs build --strict
