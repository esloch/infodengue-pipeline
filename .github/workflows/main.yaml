name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Python and dependencies
        run: uv sync --extra dev --locked
      - name: Pre-commit
        run: uv run pre-commit run --all-files
      - name: Quality
        run: uv run makim quality.all
      - name: Tests and coverage
        run: uv run makim tests.all
      - name: Package build
        run: uv build
      - name: Documentation
        run: uv run makim docs.build
      - name: Compose config
        run: uv run makim containers.config
