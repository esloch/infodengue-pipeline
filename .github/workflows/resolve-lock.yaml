name: Resolve dependency lock

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    if: github.ref == 'refs/heads/feat/pipeline-foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - name: Resolve lock from the public package index
        run: uv lock
      - uses: actions/upload-artifact@v4
        with:
          name: portable-uv-lock
          path: uv.lock
          if-no-files-found: error
          retention-days: 1
