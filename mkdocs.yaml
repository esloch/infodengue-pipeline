site_name: Infodengue Pipeline
site_url: https://github.com/esloch/infodengue-pipeline
repo_url: https://github.com/esloch/infodengue-pipeline
docs_dir: ./docs/
site_dir: ./build/
# extra_css:
#   - stylesheets/extra.css
# Page tree
nav:
  - index.md
  - Installation: installation.md
  - Architecture: architecture.md
  - Ingestion: ingestion.md
  - MinIO: minio.md
  - Events: events.md
  - Orchestration: orchestration.md
  - Analysis contract: analysis-contract.md
  - Database: database.md
  - Migration plan: migration-plan.md
  - Development: development.md
  - Operations: operations.md
  - Architecture decisions:
      - ADR 0001: adr/0001-standalone-pipeline-service.md
      - ADR 0002: adr/0002-minio-transient-ingress.md
      - ADR 0003: adr/0003-rabbitmq-celery-coordination.md
      - ADR 0004: adr/0004-transactional-outbox.md
      - ADR 0005: adr/0005-analysis-as-external-oci-job.md
  - Changelog: changelog.md
  - Contributing: contributing.md
theme:

  name: material

  features:
    - content.code.annotate
    - content.tabs.link
    - header.autohide
    - navigation.indexes
    - navigation.instant
    - search.highlight
    - search.share
    - search.suggest
  icon:
    repo: fontawesome/brands/github
  palette:
    scheme: slate
    primary: white
    accent: lime
  # custom_dir: docs/overrides
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - codehilite
  - def_list
  - footnotes
  - md_in_html
  - meta
  - pymdownx.details
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.inlinehilite:
      style_plain_text: python
  - pymdownx.magiclink:
      provider: github
      repo_url_shortener: true
  - pymdownx.saneheaders
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc
extra:
  project_name: "Infodengue Pipeline"
  team:
    - name: "Active maintainers"
      members:
        - esloch
    - name: "Former maintainers"
      members:
        - esloch
  support_levels:
    supported:
      icon: :material-check-decagram:{ .verified }
      description: Tested in CI. If this doesn't work for you, please [file an issue](/issues/new).
    bug:
      icon: :material-bug:{ .bug }
      description: Should work but doesn't because upstream is broken. Supported on a best-effort basis.
    unsupported:
      icon: :material-cancel:{ .cancel }
      description: Unlikely to ever be supported or no upstream support.

copyright: "Copyright &copy; 2026, Sandro Loch"
