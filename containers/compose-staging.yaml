services:
  postgres:
    image: postgres:16-alpine
    networks:
      default:
        aliases:
          - pipeline-postgres
    environment:
      POSTGRES_DB: pipeline_staging
      POSTGRES_USER: pipeline_staging
      POSTGRES_PASSWORD: ${PIPELINE_POSTGRES_PASSWORD:?set staging secret}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - pipeline_staging_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline_staging -d pipeline_staging"]
      interval: 5s
      timeout: 3s
      retries: 12

  rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    networks:
      default:
        aliases:
          - pipeline-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: pipeline_staging
      RABBITMQ_DEFAULT_PASS: ${PIPELINE_RABBITMQ_PASSWORD:?set staging secret}
    ports:
      - "127.0.0.1:5674:5672"
    volumes:
      - pipeline_staging_rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    image: ${PIPELINE_IMAGE:?set pipeline image}
    env_file: ${PIPELINE_WORKER_ENV_FILE:-../.env.staging}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  worker-ingestion:
    image: ${PIPELINE_IMAGE:?set pipeline image}
    env_file: ${PIPELINE_WORKER_ENV_FILE:-../.env.staging}
    command:
      - celery
      - -A
      - infodengue_pipeline.messaging.celery:celery_app
      - worker
      - --loglevel=INFO
      - --queues=pipeline.ingestion
      - --concurrency=1
      - --hostname=worker-ingestion@%h
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    networks:
      - default
      - staging_integrations
    volumes:
      - ${STAGING_SINAN_INCOMING_HOST_PATH:?set shared incoming directory}/..:/var/lib/pipeline
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A infodengue_pipeline.messaging.celery:celery_app inspect ping --timeout=5 --destination=worker-ingestion@$$(hostname) | grep -q pong
      interval: 15s
      timeout: 8s
      retries: 5

  worker-events:
    image: ${PIPELINE_IMAGE:?set pipeline image}
    env_file: ${PIPELINE_WORKER_ENV_FILE:-../.env.staging}
    command:
      - celery
      - -A
      - infodengue_pipeline.messaging.celery:celery_app
      - worker
      - --loglevel=INFO
      - --queues=pipeline.events
      - --hostname=worker-events@%h
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    networks:
      - default
      - staging_integrations
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A infodengue_pipeline.messaging.celery:celery_app inspect ping --timeout=5 --destination=worker-events@$$(hostname) | grep -q pong
      interval: 15s
      timeout: 8s
      retries: 5

  worker-orchestration:
    image: ${PIPELINE_IMAGE:?set pipeline image}
    env_file: ${PIPELINE_WORKER_ENV_FILE:-../.env.staging}
    environment:
      INFODENGUE_PIPELINE_ANALYSIS_OUTPUT_ROOT: /var/lib/pipeline/analysis-output
    command:
      - celery
      - -A
      - infodengue_pipeline.messaging.celery:celery_app
      - worker
      - --loglevel=INFO
      - --queues=pipeline.orchestration
      - --hostname=worker-orchestration@%h
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    networks:
      - default
      - staging_integrations
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A infodengue_pipeline.messaging.celery:celery_app inspect ping --timeout=5 --destination=worker-orchestration@$$(hostname) | grep -q pong
      interval: 15s
      timeout: 8s
      retries: 5

  worker-analysis:
    image: ${PIPELINE_ANALYSIS_IMAGE:?set analysis worker image}
    env_file: ${PIPELINE_ANALYSIS_ENV_FILE:-../.env.staging.analysis}
    environment:
      INFODENGUE_PIPELINE_ANALYSIS_OUTPUT_ROOT: /var/lib/pipeline/analysis-output
    command:
      - celery
      - -A
      - infodengue_pipeline.messaging.celery:celery_app
      - worker
      - --loglevel=INFO
      - --queues=pipeline.analysis
      - --concurrency=1
      - --hostname=worker-analysis@%h
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    networks:
      - default
      - staging_integrations
    volumes:
      - ${STAGING_ANALYSIS_OUTPUT_HOST_PATH:?set shared analysis output directory}:/var/lib/pipeline/analysis-output
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A infodengue_pipeline.messaging.celery:celery_app inspect ping --timeout=5 --destination=worker-analysis@$$(hostname) | grep -q pong
      interval: 15s
      timeout: 8s
      retries: 5
    restart: unless-stopped

  worker-beat:
    image: ${PIPELINE_IMAGE:?set pipeline image}
    env_file: ${PIPELINE_WORKER_ENV_FILE:-../.env.staging}
    command:
      - celery
      - -A
      - infodengue_pipeline.messaging.celery:celery_app
      - beat
      - --loglevel=INFO
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "raise SystemExit(0 if b'beat' in open('/proc/1/cmdline', 'rb').read() else 1)"
      interval: 15s
      timeout: 5s
      retries: 5

  validator:
    image: ${PIPELINE_IMAGE:?set pipeline image}
    env_file: ${PIPELINE_WORKER_ENV_FILE:-../.env.staging}
    environment:
      INFODENGUE_PIPELINE_ANALYSIS_OUTPUT_ROOT: /var/lib/pipeline/analysis-output
    command: ["python", "scripts/validate_staging_e2e.py"]
    restart: "no"
    networks:
      - default
      - staging_integrations
    volumes:
      - ${STAGING_ANALYSIS_OUTPUT_HOST_PATH:?set shared analysis output directory}:/var/lib/pipeline/analysis-output

  e2e-runner:
    image: ${PIPELINE_IMAGE:?set pipeline image}
    env_file:
      - ${PIPELINE_WORKER_ENV_FILE:-../.env.staging}
      - path: ${PIPELINE_E2E_ENV_FILE:-../.env.staging.e2e}
        required: false
    environment:
      INFODENGUE_PIPELINE_ANALYSIS_OUTPUT_ROOT: /var/lib/pipeline/analysis-output
    command: ["python", "scripts/run_staging_e2e.py"]
    restart: "no"
    networks:
      - default
      - staging_integrations
    volumes:
      - ${STAGING_ANALYSIS_OUTPUT_HOST_PATH:?set shared analysis output directory}:/var/lib/pipeline/analysis-output
      - ${STAGING_E2E_FIXTURE_HOST_PATH:-../.env.staging.e2e.example}:${STAGING_E2E_FIXTURE_CONTAINER_PATH:-/tmp/staging-e2e-fixture.dbf}:ro

volumes:
  pipeline_staging_pgdata:
  pipeline_staging_rabbitmq:

networks:
  staging_integrations:
    external: true
    name: ${STAGING_INTEGRATION_NETWORK:?set existing staging network}
