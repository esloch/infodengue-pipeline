name: infodengue-pipeline-dev

services:
  postgres:
    image: postgres:16-alpine
    networks:
      default:
        aliases:
          - pipeline-postgres
    environment:
      POSTGRES_DB: pipeline_dev
      POSTGRES_USER: pipeline_dev
      POSTGRES_PASSWORD: pipeline_dev_only
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pipeline_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline_dev -d pipeline_dev"]
      interval: 5s
      timeout: 3s
      retries: 12

  rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    networks:
      default:
        aliases:
          - pipeline-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: pipeline_dev
      RABBITMQ_DEFAULT_PASS: pipeline_dev_only
    ports:
      - "127.0.0.1:5673:5672"
      - "127.0.0.1:15673:15672"
    volumes:
      - pipeline_rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: infodengue-pipeline-minio:RELEASE.2025-10-15
    build:
      context: .
      dockerfile: minio/Dockerfile
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pipeline_dev
      MINIO_ROOT_PASSWORD: pipeline_dev_only
    ports:
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9003:9001"
    volumes:
      - pipeline_minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio-init:
    build:
      context: ..
      dockerfile: containers/Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    env_file: ${PIPELINE_WORKER_ENV_FILE:-../.env.example}
    command: ["python", "-m", "infodengue_pipeline", "bootstrap-minio"]
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  worker-ingestion:
    build:
      context: ..
      dockerfile: containers/Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    env_file: ${PIPELINE_WORKER_ENV_FILE:-../.env.example}
    command:
      - celery
      - -A
      - infodengue_pipeline.messaging.celery:celery_app
      - worker
      - --loglevel=INFO
      - --queues=pipeline.ingestion
      - --hostname=worker-ingestion@%h
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A infodengue_pipeline.messaging.celery:celery_app inspect ping --timeout=5 --destination=worker-ingestion@$$(hostname) | grep -q pong
      interval: 15s
      timeout: 8s
      retries: 5
    volumes:
      - pipeline_incoming:/var/lib/pipeline/incoming

  worker-events:
    build:
      context: ..
      dockerfile: containers/Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    env_file: ${PIPELINE_WORKER_ENV_FILE:-../.env.example}
    command:
      - celery
      - -A
      - infodengue_pipeline.messaging.celery:celery_app
      - worker
      - --loglevel=INFO
      - --queues=pipeline.events
      - --hostname=worker-events@%h
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A infodengue_pipeline.messaging.celery:celery_app inspect ping --timeout=5 --destination=worker-events@$$(hostname) | grep -q pong
      interval: 15s
      timeout: 8s
      retries: 5

  worker-beat:
    build:
      context: ..
      dockerfile: containers/Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    env_file: ${PIPELINE_WORKER_ENV_FILE:-../.env.example}
    command:
      - celery
      - -A
      - infodengue_pipeline.messaging.celery:celery_app
      - beat
      - --loglevel=INFO
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "raise SystemExit(0 if b'beat' in open('/proc/1/cmdline', 'rb').read() else 1)"
      interval: 15s
      timeout: 5s
      retries: 5

  worker-orchestration:
    build:
      context: ..
      dockerfile: containers/Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    env_file: ${PIPELINE_WORKER_ENV_FILE:-../.env.example}
    command:
      - celery
      - -A
      - infodengue_pipeline.messaging.celery:celery_app
      - worker
      - --loglevel=INFO
      - --queues=pipeline.orchestration
      - --hostname=worker-orchestration@%h
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A infodengue_pipeline.messaging.celery:celery_app inspect ping --timeout=5 --destination=worker-orchestration@$$(hostname) | grep -q pong
      interval: 15s
      timeout: 8s
      retries: 5

  worker-analysis:
    image: infodengue-pipeline-analysis:dev
    build:
      context: ..
      dockerfile: containers/Dockerfile.analysis
      args:
        ALERTA_ANALYSIS_BASE_IMAGE: ${ALERTA_ANALYSIS_BASE_IMAGE:-alertadengueanalise:dev-container-worker}
    env_file: ${PIPELINE_WORKER_ENV_FILE:-../.env.example}
    command:
      - celery
      - -A
      - infodengue_pipeline.messaging.celery:celery_app
      - worker
      - --loglevel=INFO
      - --queues=pipeline.analysis
      - --concurrency=1
      - --hostname=worker-analysis@%h
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - default
      - dev_integrations
    volumes:
      - pipeline_analysis_output:/var/lib/pipeline/analysis-output
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A infodengue_pipeline.messaging.celery:celery_app inspect ping --timeout=5 --destination=worker-analysis@$$(hostname) | grep -q pong
      interval: 15s
      timeout: 8s
      retries: 5
    restart: unless-stopped

volumes:
  pipeline_pgdata:
  pipeline_rabbitmq:
  pipeline_minio:
  pipeline_incoming:
  pipeline_analysis_output:

networks:
  dev_integrations:
    external: true
    name: ${DEV_INTEGRATION_NETWORK:-infodengue-dev_infodengue}
