# Staging deployment contract. Values and credentials are supplied by the
# staging environment; this file intentionally contains no live credentials.
x-required-environment:
  pipeline-state:
    - INFODENGUE_PIPELINE_DATABASE_URL
    - INFODENGUE_PIPELINE_RABBITMQ_URL
  staging-integrations:
    - INFODENGUE_PIPELINE_MINIO_ENDPOINT
    - INFODENGUE_PIPELINE_MINIO_BUCKET
    - INFODENGUE_PIPELINE_MINIO_ACCESS_KEY
    - INFODENGUE_PIPELINE_MINIO_SECRET_KEY
    - INFODENGUE_PIPELINE_ALERTA_SOURCE_DATABASE_URL
    - INFODENGUE_PIPELINE_ANALYSIS_DATABASE_URL (worker-analysis only)
    - INFODENGUE_PIPELINE_ANALYSIS_IMAGE
    - STAGING_SINAN_INCOMING_HOST_PATH
    - INFODENGUE_PIPELINE_ANALYSIS_OUTPUT_ROOT

x-ownership:
  materialization: infodengue-pipeline owns the explicitly selected bucket/prefix
  incoming-directory: shared bind mount with the existing AlertaDengue watcher
  canonical-storage: AlertaDengue only
  analysis-runtime: dedicated worker-analysis container with embedded scientific runtime
  analysis-load-default: false

services: {}
